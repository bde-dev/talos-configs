cluster:
  inlineManifests:
    - name: local-path-provisioner-ns
      contents: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: local-path-provisioner
          labels:
            pod-security.kubernetes.io/enforce: privileged
    - name: local-path-provisioner
      contents: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: local-path-provisioner
          namespace: local-path-provisioner
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: local-path-provisioner
        rules:
          - apiGroups: [""]
            resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
            verbs: ["get", "list", "watch", "create", "delete"]
          - apiGroups: [""]
            resources: ["persistentvolumes", "endpoints"]
            verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
          - apiGroups: [""]
            resources: ["events"]
            verbs: ["create", "patch"]
          - apiGroups: ["storage.k8s.io"]
            resources: ["storageclasses"]
            verbs: ["get", "list", "watch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: local-path-provisioner
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: local-path-provisioner
        subjects:
          - kind: ServiceAccount
            name: local-path-provisioner
            namespace: local-path-provisioner
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: local-path-provisioner
          namespace: local-path-provisioner
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: local-path-provisioner
          template:
            metadata:
              labels:
                app: local-path-provisioner
            spec:
              serviceAccountName: local-path-provisioner
              containers:
                - name: local-path-provisioner
                  image: rancher/local-path-provisioner:v0.0.30
                  command:
                    - local-path-provisioner
                    - --debug
                    - start
                    - --config
                    - /etc/config/config.json
                    - --service-account-name
                    - local-path-provisioner
                    - --configmap-name
                    - local-path-config
                  volumeMounts:
                    - name: config
                      mountPath: /etc/config
                  env:
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
              volumes:
                - name: config
                  configMap:
                    name: local-path-config
        ---
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: local-path-config
          namespace: local-path-provisioner
        data:
          config.json: |-
            {
              "nodePathMap": [
                {
                  "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                  "paths": ["/var/mnt/local-path-provisioner"]
                }
              ]
            }
          setup: |-
            #!/bin/sh
            while getopts "m:s:p:" opt; do
              case $opt in
                p) absolutePath=$OPTARG;;
                s) sizeInBytes=$OPTARG;;
                m) volMode=$OPTARG;;
              esac
            done
            mkdir -m 0777 -p $absolutePath
          teardown: |-
            #!/bin/sh
            while getopts "m:s:p:" opt; do
              case $opt in
                p) absolutePath=$OPTARG;;
                s) sizeInBytes=$OPTARG;;
                m) volMode=$OPTARG;;
              esac
            done
            rm -rf $absolutePath
          helperPod.yaml: |-
            apiVersion: v1
            kind: Pod
            metadata:
              name: helper-pod
            spec:
              containers:
                - name: helper-pod
                  image: busybox:latest
                  imagePullPolicy: IfNotPresent
        ---
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: local-path
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
        provisioner: rancher.io/local-path
        volumeBindingMode: WaitForFirstConsumer
        reclaimPolicy: Delete
